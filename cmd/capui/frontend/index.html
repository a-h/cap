<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f8f9fa;
            color: #212529;
        }
        .container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 420px;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            color: #6c757d;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }
        p {
            color: #6c757d;
            margin-bottom: 2.5rem;
            font-size: 1rem;
            line-height: 1.5;
        }
        button {
            background: #212529;
            color: #fff;
            border: none;
            padding: 0.875rem 2.5rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #343a40; }
        button:active { background: #1a1e21; }
        .hint {
            margin-top: 1rem;
            color: #adb5bd;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h3.17a2 2 0 0 1 1.42.59l1.41 1.41A2 2 0 0 0 12.41 8H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
        <h1>cap</h1>
        <p>Open a folder containing your cap model to explore capabilities, invariants, and specifications.</p>
        <button onclick="openFolder()">Open Folder</button>
        <p class="hint">Or use File &rsaquo; Open Folder&hellip;</p>
    </div>
    <script>
        async function openFolder() {
            const dir = await window.go.main.App.SelectFolder();
            if (dir) {
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
